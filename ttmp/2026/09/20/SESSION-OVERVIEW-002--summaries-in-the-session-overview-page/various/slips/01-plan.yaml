almanach_studio_version: 1
theme: brutalist
paperWidth: 384
bodyScale: 1
feedLines: 8
blocks:
- id: head
  type: row
  data:
    cols:
    - w: 1fr
      text: SESSION-OVERVIEW-002
      preset: micro
    - w: 1fr
      text: PLAN
      preset: micro
      align: right
- id: r1
  type: rule
  data:
    weight: heavy
- id: gap1
  type: space
  data:
    size: s
- id: title
  type: text
  data:
    text: Summaries In The Overview
    preset: h1
    lines: 3
- id: gap2
  type: space
  data:
    size: s
- id: summary
  type: text
  data:
    text: Parse the summary blocks that agent sessions emit, show the latest per session, and let the reader browse them all.
    preset: body
- id: gap3
  type: space
  data:
    size: m
- id: planhead
  type: text
  data:
    text: PLAN
    preset: h2
- id: plan
  type: checks
  data:
    items:
    - P1 extract summary blocks
    - P2 latest summary in card
    - P3 expanded browse view
    - P4 docs validate push
- id: r2
  type: rule
  data:
    weight: hair
- id: facts
  type: kv
  data:
    items:
    - - PHASES
      - '4'
    - - NEXT
      - P1 extract summary blocks
